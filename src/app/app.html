<div class="topbar">
  <span>Young Researcher Academy · Publish · Research · Impact · Collaborate</span>
  <span>Ile-Ife, Osun State, Nigeria</span>
</div>

<header class="header">
  <nav class="nav">
    <a class="brand" routerLink="/about"><strong>Young Researcher <span>Academy</span></strong></a>
    <div class="navlinks">
      <a routerLink="/about" routerLinkActive="active">About</a>
      <a routerLink="/programmes" routerLinkActive="active">Programmes</a>
      <a routerLink="/resource" routerLinkActive="active">Resource</a>
      <a routerLink="/events" routerLinkActive="active">Events</a>
      <a routerLink="/opportunities" routerLinkActive="active">Opportunities</a>
      <a routerLink="/community" routerLinkActive="active">Community</a>
    </div>
        @if (auth.isLoggedIn()) {
      <button (click)="auth.logout()">Logout</button>
    } @else {
      <button (click)="auth.login()">Login</button>
    }
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>
